<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Adda Student Assessment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: 0;
            border-radius: 10px;
        }

        .card-header {
            background: #4B49AC;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .summary-box {
            background: #f8f9fa;
            border-left: 4px solid #4B49AC;
            border-radius: 8px;
            padding: 15px;
        }

        .table thead {
            background: #eef2ff;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .btn-fetch {
            padding: 10px 30px;
        }

        .btn-add {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 6px;
        }

        .student-name {
            font-weight: 500;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div class="container-fluid py-4">

        <!-- FILTER CARD -->
        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <i class="fas fa-graduation-cap me-2"></i>
                Learning Adda Student Assessment
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Center</label>
                        <select class="form-select" id="center">
                            <option value="">Select Center</option>
                            <option>Center A</option>
                            <option>Center B</option>
                            <option>Center C</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Batch</label>
                        <select class="form-select" id="batch">
                            <option value="">Select Batch</option>
                            <option>Batch 01</option>
                            <option>Batch 02</option>
                            <option>Batch 03</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Assessment Type</label>
                        <select class="form-select" id="assessmentType">
                            <option value="">Select Assessment Type</option>
                            <option>Baseline</option>
                            <option>Midline</option>
                            <option>Endline</option>
                        </select>
                    </div>

                </div>

                <div class="text-center mt-3">
                    <button type="button" class="btn btn-primary btn-fetch" id="fetchStudents">
                        <i class="fas fa-search me-2"></i>
                        Fetch Students
                    </button>
                </div>

            </div>
        </div>


        <!-- STUDENT LIST -->
        <div class="card shadow-sm">

            <div class="card-header d-flex justify-content-between align-items-center">

                <span>
                    <i class="fas fa-users me-2"></i>
                    Student Assessment List
                </span>

                <span class="badge bg-light text-dark fs-6" id="studentCount">
                    Total Students : 0
                </span>

            </div>

            <div class="card-body">

                <div class="summary-box mb-4">

                    <div class="row">

                        <div class="col-md-4">
                            <strong>Program :</strong><br>
                            Learning Adda
                        </div>

                        <div class="col-md-4">
                            <strong>Center :</strong><br>
                            <span id="summaryCenter">-</span>
                        </div>

                        <div class="col-md-4">
                            <strong>Batch :</strong><br>
                            <span id="summaryBatch">-</span>
                        </div>

                    </div>

                    <div class="row mt-3">

                        <div class="col-md-4">
                            <strong>Assessment Type :</strong><br>
                            <span id="summaryAssessment">-</span>
                        </div>

                    </div>

                </div>


                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead>
                            <tr>
                                <th width="70">Sl</th>
                                <th>Student Name</th>
                                <th width="130" class="text-center">Add Result</th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody">

                            <tr>
                                <td colspan="3" class="empty-message">
                                    Please select Center, Batch and Assessment Type,
                                    then click <strong>Fetch Students</strong>.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const center = document.getElementById("center");
            const batch = document.getElementById("batch");
            const assessmentType = document.getElementById("assessmentType");

            const studentTableBody = document.getElementById("studentTableBody");
            const studentCount = document.getElementById("studentCount");

            const summaryCenter = document.getElementById("summaryCenter");
            const summaryBatch = document.getElementById("summaryBatch");
            const summaryAssessment = document.getElementById("summaryAssessment");

            /*
             * Static student data for demo.
             * In the real CI4 page this array can be replaced by
             * the students returned from the database.
             */
            const students = [
                "Rahul Das",
                "Priya Roy",
                "Sourav Paul",
                "Anjali Sen",
                "Riya Kundu",
                "Arjun Ghosh",
                "Neha Sharma",
                "Sumit Ghosh",
                "Rohan Sarkar",
                "Priyanka Das"
            ];

            document.getElementById("fetchStudents").addEventListener("click", function () {

                if (!center.value || !batch.value || !assessmentType.value) {
                    alert("Please select Center, Batch and Assessment Type.");
                    return;
                }

                summaryCenter.textContent = center.value;
                summaryBatch.textContent = batch.value;
                summaryAssessment.textContent = assessmentType.value;

                studentTableBody.innerHTML = "";

                students.forEach(function (student, index) {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                <td>${index + 1}</td>

                <td class="student-name">
                    ${student}
                </td>

                <td class="text-center">
                    <a
                        href="LA_Result_updated(1).html?student=${encodeURIComponent(student)}&center=${encodeURIComponent(center.value)}&batch=${encodeURIComponent(batch.value)}&assessment=${encodeURIComponent(assessmentType.value)}"
                        class="btn btn-success btn-add"
                        title="Add Assessment Result"
                    >
                        <i class="fas fa-plus"></i>
                    </a>
                </td>
            `;

                    studentTableBody.appendChild(row);
                });

                studentCount.textContent = "Total Students : " + students.length;
            });

        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
