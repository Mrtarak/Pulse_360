<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Participant Assessment Result</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .modal-content {
            border: none;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Header */
        .modal-header {
            background: #4B49AC;
            color: #fff;
            padding: 8px 12px;
            min-height: 42px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.8;
        }

        /* Body */
        .modal-body {
            padding: 16px 12px 8px 12px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        .form-control,
        .form-select {
            height: 32px;
            font-size: 12px;
            border: 1px solid #d9dee5;
            border-radius: 6px;
            padding: 5px 10px;
        }

        textarea.form-control {
            height: 55px;
            resize: none;
        }

        .mb-2 {
            margin-bottom: 10px !important;
        }

        /* Footer */
        .modal-footer {
            border-top: none;
            padding: 8px 18px 12px 18px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .cancel-btn {
            background: #6c757d;
            border: none;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 18px;
            border-radius: 7px;
        }

        .save-btn {
            background: #198754;
            border: none;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 7px;
        }

        .cancel-btn:hover {
            background: #5c636a;
        }

        .save-btn:hover {
            background: #157347;
        }

        /* Modal size */
        .modal-dialog {
            max-width: 878px;
        }

        /* Make four SEL fields equal */
        .sel-field {
            width: 25%;
        }

        @media (max-width: 768px) {
            .sel-field {
                width: 50%;
            }
        }

        @media (max-width: 576px) {
            .sel-field {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Modal -->
    <div class="modal fade show" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="false"
        style="display:block;">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <!-- Header -->
                <div class="modal-header">

                    <h5 class="modal-title" id="resultModalLabel">
                        <i class="fas fa-clipboard-check me-1"></i>
                        Add Participant Assessment Result
                    </h5>

                    <button type="button" class="btn-close btn-close-white" aria-label="Close">
                    </button>

                </div>


                <!-- Body -->
                <div class="modal-body">

                    <div class="row">

                        <!-- Student Name -->
                        <div class="col-md-6 mb-2">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input type="text" id="studentName" class="form-control" value="Rahul Das" readonly>

                        </div>


                        <!-- Date -->
                        <div class="col-md-6 mb-2">

                            <label class="form-label">
                                Date of Assessment
                            </label>

                            <input type="date" class="form-control" placeholder="dd-mm-yyyy">

                        </div>


                        <!-- Tailoring -->
                        <div class="col-md-4 mb-2">

                            <label class="form-label">
                                Remark Tailoring Grade
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>A+</option>
                                <option>A</option>
                                <option>B+</option>
                                <option>B</option>
                                <option>C+</option>
                                <option>C</option>
                                <option>D</option>

                            </select>

                        </div>


                        <!-- Literacy -->
                        <div class="col-md-4 mb-2">

                            <label class="form-label">
                                Remark Literacy Grade
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>A+</option>
                                <option>A</option>
                                <option>B+</option>
                                <option>B</option>
                                <option>C+</option>
                                <option>C</option>
                                <option>D</option>

                            </select>

                        </div>


                        <!-- Numeracy -->
                        <div class="col-md-4 mb-2">

                            <label class="form-label">
                                Remark Numeracy Grade
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>A+</option>
                                <option>A</option>
                                <option>B+</option>
                                <option>B</option>
                                <option>C+</option>
                                <option>C</option>
                                <option>D</option>

                            </select>

                        </div>


                        <!-- Ethics -->
                        <div class="col-md-3 mb-2">

                            <label class="form-label">
                                Ethics
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>1 (Need Improvement)</option>
                                <option>2 (Good)</option>
                                <option>3 (Excellent)</option>
                                <option>4 (OutStanding)</option>

                            </select>

                        </div>


                        <!-- Empathy -->
                        <div class="col-md-3 mb-2">

                            <label class="form-label">
                                Empathy
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>1 (Need Improvement)</option>
                                <option>2 (Good)</option>
                                <option>3 (Excellent)</option>
                                <option>4 (OutStanding)</option>

                            </select>

                        </div>


                        <!-- Excellence -->
                        <div class="col-md-3 mb-2">

                            <label class="form-label">
                                Excellence
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>1 (Need Improvement)</option>
                                <option>2 (Good)</option>
                                <option>3 (Excellent)</option>
                                <option>4 (OutStanding)</option>>

                            </select>

                        </div>


                        <!-- Eagerness -->
                        <div class="col-md-3 mb-2">

                            <label class="form-label">
                                Eagerness
                            </label>

                            <select class="form-select">

                                <option selected>Choose</option>
                                <option>1 (Need Improvement)</option>
                                <option>2 (Good)</option>
                                <option>3 (Excellent)</option>
                                <option>4 (OutStanding)</option>

                            </select>

                        </div>


                        <!-- Remarks -->
                        <div class="col-md-6 mb-2">

                            <label class="form-label">
                                Remarks or Any Notes
                            </label>

                            <textarea class="form-control" placeholder="Remarks"></textarea>

                        </div>


                        <!-- SEL Remarks -->
                        <div class="col-md-6 mb-2">

                            <label class="form-label">
                                Remarks on SEL Assessments
                            </label>

                            <textarea class="form-control" placeholder="SEL Remarks"></textarea>

                        </div>


                        <!-- Form Filled By -->
                        <div class="col-md-6 mb-2">

                            <label class="form-label">
                                Assessed By
                            </label>

                            <input type="text" class="form-control" placeholder="Assessed By ">

                        </div>

                    </div>

                </div>


                <!-- Footer -->
                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary cancel-btn">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-success save-btn">
                        <i class="fas fa-save me-1"></i>
                        Save Result
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
