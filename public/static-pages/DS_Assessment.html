<!DOCTYPE html>

    <title>Digital Shakti Student Result Entry</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Your Existing CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/custom.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: 0;
            border-radius: 10px;
        }

        .card-header {
            background: #4B49AC;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .summary-box {
            background: #f8f9fa;
            border-left: 4px solid #4B49AC;
            border-radius: 8px;
            padding: 15px;
        }

        .table thead {
            background: #eef2ff;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .result-select {
            min-width: 150px;
        }

        .grade-select {
            min-width: 90px;
        }

        .remark-input {
            min-width: 220px;
        }

        .btn-fetch,
        .btn-save {
            padding: 10px 30px;
        }
    </style>

</head>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                        <label class="form-label">
                            Batch

                        <select class="form-select">

                            <option>Select Batch</option>
                            <option>Batch 01</option>
                            <option>Batch 02</option>
                            <option>Batch 03</option>

                        </select>

                    </div>

                    <!-- Assessment Type -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Assessment Type
                        </label>

                        <select class="form-select">

                            <option>Select Assessment Type</option>
                            <option>Baseline</option>
                            <option>Endline</option>

                        </select>

                    </div>

                </div>

                <div class="text-center mt-3">

                    <button class="btn btn-primary btn-fetch">

                        <i class="fas fa-search me-2"></i>

                        Fetch Students

                    </button>

                </div>

            </div>

        </div>
